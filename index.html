<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waveform – Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" id="bg"></div>

  <main class="app">
    <!-- Now playing -->
    <section class="player" aria-label="Music player">
      <div class="art-wrap">
        <img id="cover" class="cover" src="" alt="Album artwork">
      </div>

      <div class="info">
        <h1 id="title">—</h1>
        <p id="artist">—</p>
        <p id="album" class="album">—</p>
      </div>

      <div class="progress-wrap">
        <span id="current" class="time">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="duration" class="time">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffle" class="ctl small" aria-label="Shuffle" aria-pressed="false" title="Shuffle">🔀</button>
        <button id="prev" class="ctl" aria-label="Previous" title="Previous">⏮</button>
        <button id="play" class="ctl play" aria-label="Play" title="Play / Pause">▶</button>
        <button id="next" class="ctl" aria-label="Next" title="Next">⏭</button>
        <button id="repeat" class="ctl small" aria-label="Repeat: off" title="Repeat">🔁</button>
      </div>

      <div class="extras">
        <button id="fav" class="ctl small" aria-label="Favorite" aria-pressed="false" title="Favorite">♡</button>
        <div class="volume">
          <button id="mute" class="ctl small" aria-label="Mute" title="Mute">🔊</button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
        <label class="autoplay" title="Play next song automatically">
          <input type="checkbox" id="autoplay" checked> Autoplay
        </label>
      </div>
    </section>

    <!-- Playlist -->
    <aside class="playlist" aria-label="Playlist">
      <div class="pl-head">
        <h2>Playlist</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" data-view="all" role="tab">All</button>
          <button class="tab" data-view="fav" role="tab">Favorites</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No favorite songs yet. Tap ♡ on a track.</p>
      <label class="add-files">
        + Add your own audio files
        <input type="file" id="file-input" accept="audio/*" multiple hidden>
      </label>
    </aside>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="js/tracks.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
